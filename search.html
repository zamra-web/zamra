<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Search Results | FlyCreative</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --fc-red: #e41a4a;
      --fc-dark: #1a1a1a;
      --fc-gray: #f4f7f6;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--fc-gray);
    }

    .bg-crimson {
      background-color: var(--fc-red);
    }

    .text-crimson {
      color: var(--fc-red);
    }

    /* Matching the reference site's exact card style */
    .flight-item {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border-bottom: 3px solid #eee;
      transition: all 0.3s ease;
    }

    .flight-item:hover {
      border-bottom: 3px solid var(--fc-red);
      transform: translateY(-2px);
    }

    .btn-book {
      background: var(--fc-red);
      color: #fff;
      padding: 8px 20px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 13px;
    }

    .loader-ring {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(228, 26, 74, 0.3);
      border-radius: 50%;
      border-top-color: var(--fc-red);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <header class="bg-white py-4 shadow-md border-b-2 border-red-600">
    <div class="container mx-auto px-6 flex justify-between items-center">
      <img src="https://storage.googleapis.com/creativefilesindia/BetaFiles/Logo/LogoSmNew.png" class="h-10">
      <div class="text-sm font-bold text-gray-500 uppercase flex gap-4">
        <span>Call 24/7: 0480 661 6161</span>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-4 py-10 max-w-5xl">

    <div class="bg-white rounded-lg shadow-xl overflow-hidden mb-10">
      <div class="bg-crimson p-4">
        <h3 class="text-white font-bold"><i class="fa fa-search mr-2"></i> Search Flight Deals</h3>
      </div>
      <div class="p-6 flex flex-wrap md:flex-nowrap gap-4 items-end">
        <div class="flex-1">
          <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">Destination City</label>
          <select id="destination"
            class="w-full border-2 border-gray-100 p-3 rounded focus:border-red-500 outline-none font-bold text-gray-700">
            <option value="JED">Jeddah (JED)</option>
            <option value="DXB">Dubai (DXB)</option>
            <option value="RUH" selected>Riyadh (RUH)</option>
            <option value="DOH">Doha (DOH)</option>
          </select>
        </div>
        <button onclick="search()"
          class="bg-crimson text-white px-10 py-3.5 rounded font-black uppercase hover:bg-black transition-all">
          Check Availability
        </button>
      </div>
    </div>

    <div id="resultsHeader" class="hidden mb-6">
      <h2 class="text-2xl font-black text-gray-800 uppercase tracking-tight">
        Live Flights to <span id="locName" class="text-crimson">...</span>
      </h2>
      <div class="h-1 w-20 bg-crimson mt-1"></div>
    </div>

    <div id="loading" class="hidden text-center py-20">
      <div class="loader-ring"></div>
      <p class="mt-4 text-gray-500 font-bold animate-pulse">Syncing with FlyCreative Servers...</p>
    </div>

    <div id="flightList" class="space-y-6"></div>
  </div>

  <script>
    async function search() {
      const dest = document.getElementById('destination').value;
      const list = document.getElementById('flightList');
      const loader = document.getElementById('loading');
      const header = document.getElementById('resultsHeader');

      // 1. Reset UI
      list.innerHTML = '';
      loader.classList.remove('hidden');
      header.classList.add('hidden');

      try {
        // IMPORTANT: Use your Production URL from n8n here!
        const response = await fetch('https://n8n.srv1046139.hstgr.cloud/webhook/get-flights', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ destination: dest })
        });

        const data = await response.json();
        loader.classList.add('hidden');
        header.classList.remove('hidden');
        document.getElementById('locName').innerText = dest;

        if (!data || data.length === 0) {
          list.innerHTML = `<div class="text-center text-gray-400 py-10 font-bold border-2 border-dashed rounded-xl">No flights currently found for ${dest}. Try another destination.</div>`;
          return;
        }

        // 2. Build Flight Cards
        data.forEach(item => {
          list.innerHTML += `
                        <div class="flight-item p-6 flex flex-wrap md:flex-nowrap items-center justify-between gap-6">
                            <div class="flex items-center gap-6">
                                <div class="w-24 h-12 flex items-center justify-center border rounded p-2 bg-gray-50">
                                    <img src="https://flycreativekdr.com:8443/FlyCreativeNG/css2/img/Flight_Logo/${item.airline}.png" 
                                         onerror="this.src='https://via.placeholder.com/100x40?text=AIRLINE'" class="max-h-full">
                                </div>
                                <div>
                                    <div class="text-xs font-bold text-gray-400 uppercase tracking-widest">${item.airline}</div>
                                    <div class="text-2xl font-black text-gray-800">${item.origin} <i class="fa fa-long-arrow-right mx-2 text-red-500 text-sm"></i> ${item.destination}</div>
                                    <div class="text-xs text-gray-500 font-medium"><i class="fa fa-suitcase mr-1"></i> ${item.luggage}</div>
                                </div>
                            </div>

                            <div class="bg-gray-50 px-6 py-2 rounded-full border border-gray-100 text-center">
                                <span class="block text-[10px] uppercase font-bold text-gray-400">Available Seats</span>
                                <span class="text-xl font-black text-green-600">${item.seats}</span>
                            </div>

                            <div class="text-right">
                                <div class="text-3xl font-black text-gray-900 leading-none">${item.price}</div>
                                <button class="btn-book mt-3 w-full md:w-auto shadow-lg shadow-red-200">Book Now</button>
                            </div>
                        </div>
                    `;
        });

      } catch (error) {
        loader.classList.add('hidden');
        alert("Connection Error: Make sure your n8n workflow is Active and set to Production.");
        console.error(error);
      }
    }

    // Auto-load on start
    window.onload = search;
  </script>
</body>

</html>
